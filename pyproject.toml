[project]
name = "electoral-data"
version = "0.1.0"
description = "This repo takes electoral and socio economic data of Italy and uses Bayes to build >"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
license = "///"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pandas (>=3.0.3,<4.0.0)",
    "numpy (<2.5)",
    "geopandas (>=1.1.4,<2.0.0)",
    "pymc (>=6.1.0,<7.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "libpysal (>=4.15.0,<5.0.0)",
    "xgboost (>=3.3.0,<4.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "pathlib (>=1.0.1,<2.0.0)",
    "joblib (>=1.5.3,<2.0.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
