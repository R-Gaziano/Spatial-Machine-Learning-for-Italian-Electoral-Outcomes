# configs/pipeline_conig.yaml

data:
  geopackage_path: "./italian_geo_data_polygons.gpkg"
  raw_elections_dir: "./Elections"
  crs: "EPSG:32632"

imputation:
  knn_neighbors: 8
  number_covariates: 5
  cpu_cores_ratio: 0.5 
  int_prior: -1

features:
  block_size_meters: 50000
  reference_cities:
    Roma: {"lat": 41.892, "lon": 12.511}
    Milano: {"lat": 45.464, "lon": 9.190}
    Napoli: {"lat": 40.852, "lon": 14.268}
    Torino: {"lat": 45.070, "lon": 7.687}
    Palermo: {"lat": 38.117, "lon": 13.364}
    Genova: {"lat": 44.405, "lon": 8.944}
    Bologna: {"lat": 44.494, "lon": 11.339}
    Firenze: {"lat": 43.779, "lon": 11.246}
    Bari: {"lat": 41.121, "lon": 16.870}
    Catania: {"lat": 37.492, "lon": 15.070}

model:
  target_col: "M5S_RATIO"
  group_col: "BLOCK_ID"
  categorical_cols: ["REGIONE"]
  split_1_test_size: 0.3
  split_2_test_size: 0.5
  feature_cols:
    - "OCCUPAZIONE_RATIO"
    - "ACCESSIBILITA_SERVIZI"
    - "BASSA_EDUCAZIONE_RATIO"
    - "INDICE_COMPOSITO"
    - "ADDETTI_RESIDENTI_RATIO"
    - "LAVORATORI_POCO_PRODUTTIVI_RATIO"
    - "ADDETTI_ETA_MEDIA"
    - "ADDETTI_MICRO_IMPRESE_RATIO"
    - "RACCOLTA_DIFFERENZIATA_RATIO"
    - "DENSITA_INDUSTRIA"
    - "ADDETTI_FEMMINE_RATIO"
    - "ADDETTI_IMPRESE_INDIVIDUALI_RATIO"
    - "CASE_ABITATE"
    - "PROPRIETA"
    - "CONSUMO_SUOLO"
    - "DIPENDENTI_MICRO_IMPRESE_RATIO"
    - "SUPERFICIE_TOTALE"
    - "SUPERFICIE_UTILIZZATA_ETTARI"
    - "R_PENSIONE_F"
    - "ADDETTI_ALTA_TECNOLOGIA_RATIO"
    - "MONTAGNA_INTERNA"
    - "ALTRO_TITOLO"
    - "NUMERO_UNITA_AGRICOLE"
    - "REDDITI_UNITA_AGRICOLE"
    - "TOTALE_FEMMINE_F"
    - "R_LAVORO_AUTONOMO_F"
    - "R_LAVORO_DIPENDENTE_F"
    - "11"
    - "14"
    - "8"
    - "9"
    - "15"
    - "16"
    - "17"
    - "R_LAVORO_DIPENDENTE_E"
    - "R_IMPRENDITORE_ORD_F"
    - "85"
    - "88"
    - "86"
    - "DIVORZIATI_MASCHI_F"
    - "R_FABBRICATI_F"
    - "R_FABBRICATI_E"
    - "AFFITTO"
    - "QUARTO_GRADO_F"
    - "TERZO_GRADO_F"
    - "CENTROID_X"
    - "CENTROID_Y"
    - "DIST_TO_CITY"
    - "REGIONE"
    - "LAG_INDICE_COMPOSITO"

training:
  random_state: 13
  test_size_split1: 0.3
  test_size_split2: 0.5
  xgboost:
    n_estimators: 8000
    learning_rate: 0.02
    max_depth: 6
    subsample: 0.8
    colsample_bytree: 0.8
    early_stopping_rounds: 500
    min_child_weight: 4
    gamma: 0.1
    reg_alpha: 0.1
    reg_lambda: 2
    tree_method: "hist"
    objective: "reg:squarederror"
    eval_metric: "rmse"
